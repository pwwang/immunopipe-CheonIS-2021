[plugin_opts]
args_dump = true

[SampleInfo.in]
infile = [ "data/samples.txt" ]

[SeuratPreparing.envs]
cache = "./.cache"

[SeuratClusteringOfAllCells.envs]
cache = "./.cache"
FindClusters = {resolution = 1.6}

[ClusterMarkersOfAllCells.envs]
cache = "./.cache"

[TOrBCellSelection]

[SeuratClustering.envs]
cache = "./.cache"

[ClusterMarkers.envs]
cache = "./.cache"

[SeuratClusterStats.envs]
cache = "./.cache"

[SeuratClusterStats.envs.dimplots.UMAP]

[SeuratClusterStats.envs.features."Signature gene expression"]
plot_type = "dot"
features = [
    "HOPX", "ZNF683", "ITGAE", "ID2", "GZMK", "EOMES", "TIGIT", "CD27", "KLRG1",
    "NKG7", "NR4A2", "TNF", "ITGA4", "IL7R", "CD28", "CXCR6", "PRF1", "CD69",
    "IFNG", "GZMA",
]

[ClonalStats.envs]
cache = "./.cache"
